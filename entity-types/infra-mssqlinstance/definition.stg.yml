domain: INFRA
type: MSSQLINSTANCE

synthesis:
  rules:
    - ruleName: infra_mssqlinstance_entityId
      identifier: entityId
      name: entityName
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: event_type
          value: "MssqlInstanceSample"
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D
        entityKey:
          ttl: P1D

    - ruleName: infra_mssqlinstance_service_instance_id_metrics
      identifier: service.instance.id
      name: service.instance.id
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: sqlserver.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: service.instance.id
          present: true
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [endpoint, server.address]
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_service_instance_id_logs
      identifier: service.instance.id
      name: service.instance.id
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: event.name
          prefix: db.server.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
        - attribute: service.instance.id
          present: true
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [server.address, endpoint]
        db.namespace:
          entityTagName: database.name
        otel.library.version:
          entityTagName: instrumentation.version

